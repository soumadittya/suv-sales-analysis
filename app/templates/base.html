<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}SUV Value Guide{% endblock %}</title>
<meta name="description" content="Check whether an Indian SUV's price is fair, find the best-value trim, and find variants with the features you need. CarDekho prices, {{ source.city }}, {{ source.date }}.">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="vg-root">

<header class="vg-header">
  <div class="vg-wrap {% block wide %}{% endblock %}">
    <a class="vg-brand" href="/">SUV Value Guide</a>
    <nav class="vg-nav" aria-label="Main">
      <a href="/"{% if nav == "find" %} aria-current="page"{% endif %}>Find</a>
      <a href="/compare"{% if nav == "compare" %} aria-current="page"{% endif %}>Compare</a>
      <a href="/about"{% if nav == "about" %} aria-current="page"{% endif %}>About</a>
    </nav>
  </div>
</header>

<main class="vg-wrap vg-main {{ self.wide() }}">
{% block content %}{% endblock %}
</main>

<footer class="vg-footer">
  <div class="vg-wrap {{ self.wide() }}">
    {% block footer %}Prices from CarDekho, {{ source.city }}, {{ source.date }}. List prices; dealers often sell for less. An independent project, not linked to CarDekho or any carmaker. <a href="/about">About the data</a>{% endblock %}
  </div>
</footer>

</div>
</body>
</html>
